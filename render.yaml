# Render Blueprint for the booking API (api/). Free plan: the service sleeps after
# 15 idle minutes and the disk is not persistent, so the SQLite file is rebuilt and
# re-seeded on every start. Good for a demo; use a paid disk or Postgres for real data.
services:
  - type: web
    name: gezdir-beni-api
    runtime: node
    plan: free
    rootDir: api
    # NODE_ENV=production would skip devDependencies, and the Prisma CLI is one.
    buildCommand: npm ci --include=dev && npx prisma generate
    startCommand: npx prisma migrate deploy && npm run db:seed && npm start
    healthCheckPath: /api/health
    envVars:
      # Node runs the .ts sources directly, which needs unflagged type stripping.
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      # The site's URL on Vercel; asked for when the Blueprint is created.
      - key: WEB_ORIGIN
        sync: false
      # Generated by Render; read the admin password from the service's
      # Environment tab.
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
